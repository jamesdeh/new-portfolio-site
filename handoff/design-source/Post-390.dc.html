<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<title>Post at 390, paper mode</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./signal-noir.css">
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Geist";src:url(../fonts/Geist-Variable.woff2) format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:"Geist Mono";src:url(../fonts/GeistMono-Variable.woff2) format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:"Geist Pixel Square";src:url(../fonts/GeistPixel-Square.woff2) format("woff2");font-weight:400;font-display:swap}
body{margin:0}
</style>
</helmet>
<div style="width: 100%; background: #F3F1EC">
  <dc-import name="Post" accent="{{accent}}" mode="{{mode}}" hint-size="100%,6600px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"enum","options":["red","green","amber","paua"],"default":"red","section":"Theme"},"mode":{"editor":"enum","options":["noir","paper"],"default":"paper","section":"Theme"},"$preview":{"width":390,"height":6600}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? 'red', mode: this.props.mode ?? 'paper' };
  }
}
</script>
</body>
</html>
